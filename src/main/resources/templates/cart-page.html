<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex align-items-center gap-3">

    <!-- PakMart Logo -->
    <a th:href="@{/welcome}" class="text-decoration-none">
       <h4 class="mb-0 fw-bold text-primary">
    🛍️ PakMart
</h4>
    </a>
</div>
        <!-- Progress Header -->
        <div class="mb-4 text-uppercase fw-bold">
            <span class="text-dark">Shopping Cart</span>
            <span class="text-muted"> › Checkout Details › Order Complete</span>
        </div>

        <!-- Cart Card -->
        <div class="card shadow-sm">
            <div class="card-body">

                <table class="table align-middle">
                    <thead class="border-bottom">
                        <tr class="text-uppercase text-muted small">
                            <th>Product</th>
                            <th class="text-end">Price</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-end">Total</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="item : ${cartItems}"
                            th:attr="data-invalid=${item.remainingStock + item.quantity == 0}" 
                             th:classappend="${item.remainingStock + item.quantity == 0} ? 'table-danger' : ''">
                            <!-- Product -->
                            <td>
                                <div class="d-flex align-items-center">
                                    <span th:text="${item.productName}"
                                        th:classappend="${item.remainingStock+item.quantity == 0} ? 'text-decoration-line-through text-danger' : ''">
                                    </span>
                                </div>
                            </td>

                            <!-- Price -->
                            <td class="text-end">
                                $<span th:text="${item.price}"></span>
                            </td>

                            <!-- Quantity -->
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">

                                    <!-- Decrease -->
                                    <form th:action="@{/cart/decrease}" method="post" class="d-inline">
                                        <input type="hidden" name="productID" th:value="${item.product_id}" />
                                        <button type="submit" class="btn btn-outline-secondary">−</button>
                                    </form>

                                    <!-- Quantity -->
                                    <span class="btn btn-outline-secondary disabled" th:text="${item.quantity}"></span>

                                    <!-- Increase -->
                                    <form th:action="@{/cart/increase}" method="post" class="d-inline">
                                        <input type="hidden" name="productID" th:value="${item.product_id}" />
                                        <button type="submit" class="btn btn-outline-secondary"
                                            th:disabled="${item.remainingStock < 1}">+</button>
                                    </form>

                                </div>

                                <!-- Max stock -->
                                <div class="small mt-1" th:classappend="${item.remainingStock == 0} ? 'text-danger' :
                     (${item.remainingStock < 5} ? 'text-warning' : 'text-muted')">

                                    <span th:if="${item.remainingStock == 0}">❌ Out of Stock</span>
                                    <span th:if="${item.remainingStock > 0 and item.remainingStock < 5}">
                                        ⚠ Low Stock (<span th:text="${item.remainingStock}"></span>)
                                    </span>
                                    <span th:if="${item.remainingStock >= 5}">
                                        Remaining: <span th:text="${item.remainingStock}"></span>
                                    </span>

                                </div>
                            </td>


                            <!-- Total -->
                            <td class="text-end">
                                $<span th:text="${item.totalPrice}"></span>
                            </td>

                            <!-- Remove -->
                            <td class="text-center">
                                <form th:action="@{/cart/remove}" method="post" class="d-inline">
                                    <input type="hidden" name="productID" th:value="${item.product_id}" />
                                    <button type="submit" class="btn btn-outline-danger btn-sm">
                                        Remove
                                    </button>

                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Update Cart Button -->
                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center">

                    <!-- Left side buttons -->
                    <div>
                        <a href="/products/catPd" class="btn btn-outline-secondary me-2">
                            ← Continue Shopping
                        </a>

                        <form th:action="@{/cart/empty}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger"
                                onclick="return confirm('Are you sure you want to empty your cart?');">
                                🗑 Empty Cart
                            </button>
                        </form>
                        <form th:action="@{/checkout}" id="checkoutForm" method="get" class="d-inline">
                            <button type="button" class="btn btn-success" onclick="validateCheckout()">
                                🛒 Checkout
                            </button>
                        </form>
                    </div>

                    <!-- Right side total -->
                    <div class="text-end">
                        <span class="text-muted">Total</span>
                        <h3 class="fw-bold mb-0">
                            $<span th:text="${#numbers.formatDecimal(checkoutPrice, 1, 2)}"></span>
                        </h3>
                    </div>

                </div>


            </div>
        </div>
    </div>

</body>
<script>
function validateCheckout() {

    let rows = document.querySelectorAll("tr[data-invalid='true']");

    if (rows.length > 0) {
        alert("❌ Some products are out of stock. Please update your cart.");
        return;
    }

    document.getElementById("checkoutForm").submit();
}
</script>
</html>
