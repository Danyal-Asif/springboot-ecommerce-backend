<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container mt-4">

        <!-- Top Header -->
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex justify-content-between align-items-center">

                <!-- Welcome Section -->
                <!-- Left Section (Logo + Welcome) -->
<div class="d-flex align-items-center gap-3">

    <!-- PakMart Logo -->
    <a th:href="@{/welcome}" class="text-decoration-none">
       <h4 class="mb-0 fw-bold text-primary">
    🛍️ PakMart
</h4>
    </a>

    <!-- Welcome Name -->
    <h6 class="mb-0 text-muted">
        Welcome, <span class="fw-bold" th:text="${name}"></span>
    </h6>

</div>

                <!-- Right Buttons -->
                <div class="d-flex gap-2">

                    <a th:href="@{/cart/mycart}" class="btn btn-outline-dark position-relative">
                        🛒 My Cart
                    </a>

                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-danger">
                            Logout
                        </button>
                    </form>

                </div>
            </div>
        </div>


        <!-- Filter Section -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/products/catPd}" method="get" class="row g-2 align-items-center">

                    <div class="col-auto fw-bold">
                        Filter:
                    </div>

                    <div class="col-md-4">
                        <select name="pCategory" class="form-select">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">
                            </option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">
                            Search
                        </button>
                    </div>

                </form>
            </div>
        </div>


        <!-- Products Table -->
        <div class="card shadow-sm">
            <div class="card-body">

                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 35%">Title</th>
                            <th style="width: 15%">Category</th>
                            <th style="width: 10%" class="text-center">Stock</th>
                            <th style="width: 10%" class="text-end">Price</th>
                            <th style="width: 15%" class="text-center">Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:if="${products.empty}">
                            <td colspan="5" class="text-center text-muted">
                                No Products Available
                            </td>
                        </tr>

                        <tr th:each="product : ${products}">

                            <td class="fw-semibold" th:text="${product.name}">
                            </td>

                            <td>
                                <span class="badge bg-secondary" th:text="${product.category}">
                                </span>
                            </td>

                            <td class="text-center" th:text="${product.inStock > 0 ? product.inStock : 'Out of Stock'}"
                                th:classappend="${product.inStock > 0 ? ' text-success fw-bold' : ' text-danger fw-bold'}">
                            </td>

                            <td class="text-end fw-bold">
                                $<span th:text="${product.price}"></span>
                            </td>

                            <td class="text-center">
                                <form th:action="@{/cart/add}" method="post">
                                    <input type="hidden" name="productId" th:value="${product.id}" />
                                    <button type="submit" class="btn btn-sm btn-success"
                                        th:disabled="${product.inStock == 0}">
                                        Add to Cart
                                    </button>
                                </form>
                            </td>

                        </tr>
                    </tbody>
                </table>

            </div>
        </div>

    </div>

</body>

</body>

</html>
